name: Server CI/CD

on:
  pull_request:
    paths:
      - "battery_monitor_server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    tags: [v*.*.*]
    paths:
      - "battery_monitor_server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/roboracer-battery-monitor-server

jobs:
  test:
    name: Test server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battery_monitor_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - run: docker build --tag server-ci .

  publish:
    name: Publish image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}} # Genera il tag es: 1.0.0
            type=semver,pattern={{major}}.{{minor}} # Genera il tag es: 1.0
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: battery_monitor_server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
