<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VESC Dashboard</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header>
        <h1>VESC Performance Monitor</h1>
    </header>

    <div class="dashboard-container">
        <div class="card">
            <h2>Voltage</h2>
            <div class="chart-wrapper">
                <canvas id="voltageChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Current</h2>
            <div class="chart-wrapper">
                <canvas id="currentChart"></canvas>
            </div>
        </div>
    </div>

    <!-- <div class="extra-space"></div> -->
    <div class="labels">
        <div class="label" id="currentVoltage">Current smooth voltage: -- V</div>
        <div class="label" id="capacityLeft">Capacity left: -- </div>
        <div class="label" id="timeLeft">Time left: -- </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="static/app.js"></script>
</body>
</html>
